[package]
name = "chaperone_bridge"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["staticlib"]

[dependencies]
chaperone-pdb = { path = "../chaperone-pdb" }
chaperone-sim = { path = "../chaperone-sim" }
cxx = "1.0.199"
cxx-qt = "0.9.1"
cxx-qt-lib = { version = "0.9.1", features = ["qt_gui", "qt_qml"] }

[build-dependencies]
cxx-qt-build = "0.9.1"
